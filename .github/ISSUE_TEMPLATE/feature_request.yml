name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Siderea is deliberately focused: manual camera, long-exposure timelapse, astro stacking, and export.
        Accounts, cloud sync, ads, analytics and AI filters are out of scope.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like instead?
  - type: input
    id: device
    attributes:
      label: Phone model (if hardware-specific)
