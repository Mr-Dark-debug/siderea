# Builds upon detekt's defaults (see buildUponDefaultConfig in siderea.quality.gradle.kts).
# Only deviations from the defaults live here, each with a reason.

naming:
  MatchingDeclarationName:
    # ktlint's filename rule already enforces this and understands files that hold a class plus functions.
    active: false
  FunctionNaming:
    # Composable functions are PascalCase by convention.
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'

complexity:
  LongParameterList:
    # Composable parameter lists are idiomatically long; they are not "functions with too many arguments".
    ignoreAnnotated: ['Composable']
    allowedFunctionParameters: 8
  LongMethod:
    ignoreAnnotated: ['Composable']
    allowedLines: 80
  CyclomaticComplexMethod:
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    ignoreAnnotated: ['Composable']
    # Objects such as EnumNames hold one tiny function per Camera2 enum; private helpers don't count.
    allowedFunctionsPerObject: 20
    ignorePrivate: true

style:
  MagicNumber:
    # Design tokens and sensor unit conversions are named at their definition; tests use literals.
    ignoreAnnotated: ['Composable']
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreNamedArgument: true
    ignoreExtensionFunctions: true
    excludes: ['**/test/**', '**/androidTest/**']
  UnusedPrivateFunction:
    ignoreAnnotated: ['Preview']
  MaxLineLength:
    maxLineLength: 120
